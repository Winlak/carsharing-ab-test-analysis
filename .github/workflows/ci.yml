name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test key calculations
        run: python -m pytest -q
      - name: Reproduce SQL mart, analysis, figures and notebook
        run: make reproduce-ci
